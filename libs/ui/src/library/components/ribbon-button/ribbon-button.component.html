<!-- The title falls back to the label so a button that gives no tooltip still explains itself on
     hover once compact mode has taken its label away. -->
<div #buttonContainer class="button-container" [attr.title]="tooltip() || (label() | translate) || null">
  <!-- aria-label is carried whether or not the label is on screen, because compact mode hides it
       below 36rem of ribbon width and the icon alone names nothing. Null rather than an empty
       string when there is neither label nor tooltip: an empty aria-label names the control
       nothing at all, which suppresses the fallback a screen reader would otherwise use. -->
  <a
    class="button"
    role="button"
    [attr.tabindex]="isButtonDisabled ? -1 : 0"
    [attr.aria-disabled]="isButtonDisabled"
    [attr.aria-label]="accessibleName ? (accessibleName | translate) : null"
    [class.disabled]="isButtonDisabled"
    [class.success]="status() === 'success'"
    [class.warning]="status() === 'warning'"
    [class.failure]="status() === 'failure'"
    [class.small]="iconSize() === 'small'"
    (click)="onButtonClicked()"
    (keydown.enter)="onButtonClicked()"
    (keydown.space)="onButtonClicked(); $event.preventDefault()"
  >
    <span class="icon" [class.loading]="loading()">
      <i class="fas fa-fw" [ngClass]="[buttonIcon, color()]"></i>

      <svg [ngClass]="[color()]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
    </span>

    <span class="label" [id]="labelId" [class.text-white]="status() !== null">
      {{ label() | translate }}
    </span>
  </a>

  @if (options().length > 0) {
    <a
      class="button-dropdown"
      role="button"
      [attr.tabindex]="isButtonDisabled ? -1 : 0"
      [attr.aria-disabled]="isButtonDisabled"
      aria-haspopup="menu"
      [attr.aria-expanded]="showDropdown()"
      [attr.aria-labelledby]="chevronLabelledBy"
      [attr.aria-label]="chevronAriaLabel ? (chevronAriaLabel | translate) : null"
      [class.disabled]="isButtonDisabled"
      [class.success]="status() === 'success'"
      [class.warning]="status() === 'warning'"
      [class.failure]="status() === 'failure'"
      [class.small]="iconSize() === 'small'"
      (click)="onShowHideDropdown()"
      (keydown.enter)="onShowHideDropdown()"
      (keydown.space)="onShowHideDropdown(); $event.preventDefault()"
    >
      <i class="fas fa-chevron-down" [ngClass]="[color()]"></i>
    </a>
  }
</div>

<!-- Rendered into a CDK overlay rather than here, so the list is not cut off by an ancestor that
     clips -- lib-data-grid does, and its buttons bar sits at the top of it. The `open` class is
     what the styles key on now that the list is no longer inside this component's `.show` host. -->
<ng-template #optionsDropdown>
  <ul class="options-dropdown open" role="menu">
    @for (option of options(); track option; let i = $index) {
      <li
        role="menuitem"
        [attr.tabindex]="isOptionDisabled(option) || !isOptionVisible(option) ? -1 : 0"
        [attr.aria-disabled]="isOptionDisabled(option)"
        [class.default-option]="i === defaultOption()"
        [class.disabled]="isOptionDisabled(option)"
        [class.hidden]="!isOptionVisible(option)"
        (click)="onOptionClicked(option)"
        (keydown.enter)="onOptionClicked(option)"
        (keydown.space)="onOptionClicked(option); $event.preventDefault()"
      >
        @if (!!option.icon) {
          <i class="fas fa-fw" [ngClass]="[option.icon, color()]"></i>
        }
        {{ option.label | translate }}
      </li>
    }
  </ul>
</ng-template>

<ng-template #ribbon>
  <lib-ribbon-group [label]="'RibbonGroup-General' | translate">
    <framework-button-refresh></framework-button-refresh>

    <shared-services-history-filter [usersCatalogEndpoint]="usersCatalogEndpoint"> </shared-services-history-filter>
  </lib-ribbon-group>
</ng-template>

<div class="history-container">
  <div class="service-history-container">
    <shared-services-history-child-list
      #service
      [controllerName]="controllerName"
      (filtersChanged)="onFiltersChanged($event)"
    >
    </shared-services-history-child-list>
  </div>

  <div class="operations-history-container">
    <shared-operations-history-child-list
      [controllerName]="controllerName"
      [filters]="operationsFilters"
      [serviceID]="service.selectedServiceID"
    >
    </shared-operations-history-child-list>
  </div>
</div>

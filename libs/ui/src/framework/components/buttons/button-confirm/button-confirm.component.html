@if (isVisible()) {
  <lib-ribbon-button
    [color]="color()"
    [disabled]="disabled()"
    [icon]="icon()"
    [label]="label()"
    [loading]="loading()"
    (action)="onButtonClicked()"
  >
  </lib-ribbon-button>
}

<framework-confirm-modal
  #modal
  [message]="modalMessage()"
  [messageIcon]="modalMessageIcon()"
  [messageIconColor]="modalMessageIconColor()"
  [title]="modalTitle()"
>
  <div footer>
    <lib-button [intent]="modalConfirmButtonIntent()" [loading]="modal.isLoading()" (click)="onDelete()">
      {{ modalConfirmButtonLabel() | translate }}
    </lib-button>
  </div>
</framework-confirm-modal>

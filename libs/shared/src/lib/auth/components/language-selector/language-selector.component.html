<div #dropdown class="dropdown right" [class.show]="showDropdown">
  <lib-button
    intent="ghost"
    [class.lang-flag-toggle]="showFlag"
    [ariaLabel]="showFlag ? (title | translate) : undefined"
    (click)="onDropdownClick()"
  >
    @if (showFlag) {
      <span class="flag flag-{{ selectedLanguage }}"></span>
    } @else {
      {{ title | translate }}
    }
  </lib-button>

  <ul>
    @for (lang of languages; track lang) {
      <li>
        <button
          type="button"
          class="dropdown-item"
          [class.selected]="lang === selectedLanguage"
          (click)="onSelectLanguage(lang)"
        >
          <span class="flag flag-{{ lang }}"></span>
          <span class="dropdown-label">{{ 'Language-' + lang | translate }}</span>
        </button>
      </li>
    }
  </ul>
</div>

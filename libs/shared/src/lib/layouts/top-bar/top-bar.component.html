<div class="top-bar">
    <div class="top-bar-section top-bar-start">
        <button class="btn top-bar-collapse" type="button" (click)="onCollapseClick()"
            [attr.aria-label]="'TopBar-Sidebar-Toggle' | translate">
            <i class="fa-solid fa-bars"></i>
        </button>

        <shared-brand></shared-brand>
        <shared-environment-badge></shared-environment-badge>
    </div>

    <div class="top-bar-section top-bar-end">
        <shared-notifications></shared-notifications>
        <shared-language-selector></shared-language-selector>

        <!-- Theme switch slot (deferred — see 2026-07-23-top-bar-update-design.md) -->

        <shared-user-profile></shared-user-profile>

        <button class="btn gray-300 top-bar-logout" type="button" (click)="onLogoutClick()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>{{ 'Main-Logout' | translate }}</span>
        </button>
    </div>
</div>

<div class="main-container">
    <lib-sidebar>
        @if (appVersion) {
            <span>v{{ appVersion }}</span>
        }
    </lib-sidebar>

    <shared-top-bar class="toolbar" (logout)="onLogoutClick()"></shared-top-bar>

    <div class="content">
        <framework-tabs>
            <router-outlet></router-outlet>
        </framework-tabs>
    </div>
</div>

<lib-modal #logoutModal position="top" size="xl" [closeButtonText]="'Main-Logout-Modal-Message-Cancel' | translate">
    <div body>
        <h5>{{ 'Main-Logout-Modal-Message' | translate }}</h5>
    </div>
    <div footer>
        <button type="button" class="btn red-600" (click)="onLogoutConfirm()">{{ 'Main-Logout-Modal-Message-Confirm' | translate }}</button>
    </div>
</lib-modal>

@if (visible && (!form || form.viewMode !== 'edit')) {
  <lib-ribbon-button
    [disabled]="disabled || (!!form && form.loading)"
    [icon]="editIcon"
    [iconSize]="iconSize"
    [label]="editLabel"
    [loading]="loading"
    (action)="onEditAction()"
  ></lib-ribbon-button>
}
@if (visible && form && form.viewMode === 'edit' && !form.isNew) {
  <lib-ribbon-button
    [color]="cancelColor"
    [disabled]="disabled || form.loading"
    [icon]="cancelIcon"
    [label]="cancelLabel"
    [loading]="loading"
    (action)="onCancelAction()"
  ></lib-ribbon-button>
}

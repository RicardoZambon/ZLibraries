@if (visible) {
  <lib-ribbon-button
    label="Button-Save"
    icon="fa-save"
    [defaultOption]="defaultOption"
    [disabled]="disabled || form?.viewMode !== 'edit' || (form?.loading ?? false)"
    [loading]="loading"
    [options]="options"
    (action)="onButtonClick($event)"
  >
  </lib-ribbon-button>
}

<framework-error-modal></framework-error-modal>

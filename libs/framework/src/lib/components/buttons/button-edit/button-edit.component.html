@if (visible && !isButtonCancelVisible && hasDataProviderEntityID) {
  <lib-ribbon-button
    [disabled]="disabled || !isAccessLoaded || isFormLoading"
    [icon]="editIcon"
    [iconSize]="iconSize"
    [label]="editLabel"
    [loading]="loading"
    (action)="onEditClicked()"
  >
  </lib-ribbon-button>
}
@if (visible && isButtonCancelVisible && hasDataProviderEntityID) {
  <lib-ribbon-button
    [color]="cancelColor"
    [disabled]="disabled || !isAccessLoaded || isFormLoading"
    [icon]="cancelIcon"
    [label]="cancelLabel"
    [loading]="loading"
    (action)="onCancelClicked()"
  >
  </lib-ribbon-button>
}

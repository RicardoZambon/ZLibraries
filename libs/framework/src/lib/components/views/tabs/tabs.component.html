@if (hasTabs) {
  <div class="tabs-container">
    <ul class="tabs-nav" role="tablist">
      @for (tab of openTabs; track trackByFn(i, tab); let i = $index) {
        <li role="presentation" [class.active]="isTabActive(tab)">
          <a
            class="tab-item"
            role="tab"
            tabindex="0"
            [attr.aria-selected]="isTabActive(tab)"
            (click)="onActivateTab(tab)"
            (keydown.enter)="onActivateTab(tab)"
            (keydown.space)="onActivateTab(tab); $event.preventDefault()"
          >
            @if (!tabLoadingStates[i]) {
              <span>{{ tabDisplayTitles[i] ?? tab.title ?? '' | translate }}</span>
            }
            @if (tabLoadingStates[i]) {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
            }
          </a>
          <button
            class="tab-close"
            type="button"
            [attr.aria-label]="'Tabs-CloseTab' | translate"
            (click)="onCloseTab(i)"
          >
            <i class="fas fa-times"></i>
          </button>
        </li>
      }
    </ul>
  </div>
}
@if (hasTabs) {
  <div class="tab-content">
    <framework-tab-breadcrumbs></framework-tab-breadcrumbs>
    <ng-content></ng-content>
  </div>
}

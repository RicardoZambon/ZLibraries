@if (hasTabs) {
  <div class="tabs-container" [class.can-scroll-left]="canScrollLeft" [class.can-scroll-right]="canScrollRight">
    <!-- Only rendered while there is something to scroll to, so the strip is not permanently
         flanked by two dead chevrons. tabindex -1 because the tablist is already one tab stop
         and the arrow keys reach every tab -- these are a pointer affordance, not a second
         keyboard path. -->
    @if (canScrollLeft) {
      <button
        class="tabs-scroll left"
        type="button"
        tabindex="-1"
        [attr.aria-label]="'Tabs-ScrollLeft' | translate"
        (click)="onScrollStrip(-1)"
      >
        <i class="fas fa-chevron-left"></i>
      </button>
    }

    <!-- Horizontally scrollable. This used to be overflow:hidden, so once the tabs were
         wider than the bar the ones past the right edge could not be reached at all. -->
    <ul #tabsNav class="tabs-nav" role="tablist">
      @for (tab of openTabs; track trackByFn(i, tab); let i = $index) {
        <li role="presentation" [class.active]="isTabActive(tab)">
          <a
            class="tab-item"
            role="tab"
            [id]="tabId(i)"
            [attr.aria-controls]="panelId"
            [attr.aria-selected]="isTabActive(tab)"
            [attr.title]="tabDisplayTitles[i] ?? tab.title ?? null"
            [attr.tabindex]="isTabActive(tab) ? 0 : -1"
            (click)="onActivateTab(tab)"
            (auxclick)="onTabAuxClick($event, i)"
            (keydown.enter)="onActivateTab(tab)"
            (keydown.space)="onActivateTab(tab); $event.preventDefault()"
            (keydown.arrowleft)="onMoveFocus(i, -1); $event.preventDefault()"
            (keydown.arrowright)="onMoveFocus(i, 1); $event.preventDefault()"
            (keydown.home)="onMoveFocus(0, 0); $event.preventDefault()"
            (keydown.end)="onMoveFocus(openTabs.length - 1, 0); $event.preventDefault()"
            (keydown.delete)="onCloseTab(i); $event.preventDefault()"
          >
            <!-- Rendered whether or not the title has resolved, so the tab keeps its width
                 and the strip does not reflow as each title arrives. -->
            <span class="label">{{ tabDisplayTitles[i] ?? tab.title ?? '' | translate }}</span>

            @if (tabLoadingStates[i]) {
              <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
            }
          </a>

          <!-- tabindex -1: the tablist is one tab stop, and the close control is reachable
               from the tab itself with Delete rather than by tabbing through every one. -->
          <button
            class="tab-close"
            type="button"
            tabindex="-1"
            [attr.aria-label]="'Tabs-CloseTab' | translate: { title: tabDisplayTitles[i] ?? tab.title ?? '' }"
            (click)="onCloseTab(i)"
          >
            <i class="fas fa-times"></i>
          </button>
        </li>
      }
    </ul>

    @if (canScrollRight) {
      <button
        class="tabs-scroll right"
        type="button"
        tabindex="-1"
        [attr.aria-label]="'Tabs-ScrollRight' | translate"
        (click)="onScrollStrip(1)"
      >
        <i class="fas fa-chevron-right"></i>
      </button>
    }
  </div>
}
@if (hasTabs) {
  <div class="tab-content" role="tabpanel" [id]="panelId" [attr.aria-labelledby]="activeTabId">
    <framework-tab-breadcrumbs></framework-tab-breadcrumbs>
    <ng-content></ng-content>
  </div>
}

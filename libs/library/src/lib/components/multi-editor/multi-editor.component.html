<lib-modal
  [closeButtonText]="closeButtonText() | translate"
  [dialog]="dialog()"
  [modalProcessing]="modalProcessing()"
  [position]="position()"
  [size]="size()"
  [title]="title() ?? ''"
>
  <div body class="body-content">
    <div class="data-grid">
      <lib-data-grid [disabled]="modalProcessing()" [lazyLoadRows]="true"></lib-data-grid>
    </div>

    <div class="data">
      <div class="buttons">
        @if (showAddButton()) {
          <lib-button
            intent="secondary"
            [disabled]="modalProcessing() || gridLoading() || formLoading || formGroup().invalid"
            (click)="onNewClick()"
          >
            {{ addButtonLabel() }}
          </lib-button>
        }
        @if (showDeleteButton() && hasSelectedKey()) {
          <lib-button
            intent="danger"
            [disabled]="modalProcessing() || gridLoading() || formLoading"
            (click)="onDeleteClick()"
          >
            {{ removeButtonLabel() }}
          </lib-button>
        }
      </div>

      <lib-form-group>
        <ng-content></ng-content>
      </lib-form-group>
    </div>
  </div>

  <div footer>
    <lib-button
      intent="primary"
      [disabled]="gridLoading() || formLoading"
      [loading]="modalProcessing()"
      (click)="onSaveClick()"
    >
      {{ 'Button-Modal-MultiEditor-Confirm' | translate }}
    </lib-button>
  </div>
</lib-modal>

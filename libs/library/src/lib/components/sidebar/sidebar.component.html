<div class="sidebar-toolbar">
  <button type="button" class="sidebar-toggle" (click)="collapse()" aria-label="Toggle navigation">
    <i class="fa-solid fa-angle-left" [class.is-collapsed]="isCollapsed"></i>
  </button>
</div>

<nav>
  @if (!isLoading) {
    <ul>
      @for (region of regions; track trackByRegion($index, region)) {
        @if (region.name) {
          <li class="sidebar-region-header">
            <span>{{ region.name | translate }}</span>
          </li>
        }
        @for (menu of region.items; track trackByFn($index, menu)) {
          <lib-sidebar-item [menu]="menu"> </lib-sidebar-item>
        }
      }
      @if (hasFailed) {
        <div class="error">
          <div>
            <i class="fa-solid fa-fw fa-triangle-exclamation"></i>
            <span>{{ configErrorText }}</span>
          </div>
        </div>
      }
    </ul>
  } @else {
    <div class="loading">
      <div>
        <svg class="animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span>{{ configLoadingText }}</span>
      </div>
    </div>
  }
</nav>

<div class="sidebar-footer"><ng-content></ng-content></div>

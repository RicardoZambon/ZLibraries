<div class="scroll-spy">
  <a
    *ngFor="let title of titles; let i = index"
    class="item"
    [class.active]="i === activeSection"
    role="button"
    tabindex="0"
    [attr.aria-current]="i === activeSection"
    (click)="scrollTo(i)"
    (keydown.enter)="scrollTo(i)"
    (keydown.space)="scrollTo(i); $event.preventDefault()"
    >{{ title }}</a
  >
</div>

<div
  class="content"
  libScrollSpy
  [class.no-scroll-spy]="titles.length === 0"
  [spiedTags]="['lib-group-accordion']"
  (activeSectionChange)="activeSectionChanged($event)"
>
  <ng-content></ng-content>
</div>

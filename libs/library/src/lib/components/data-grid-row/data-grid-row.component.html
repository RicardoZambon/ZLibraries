<div *ngIf="dataGridDataset.configs.multiSelect"
class="cell selection"
(click)="onToggleSelection()"
(onResize)="onResizeSelection($event)">
    <!-- Null, not false. An attribute binding writes disabled="false" when the value is false, and
    any value at all disables a control -- so bound to the boolean directly every checkbox in the
    grid rendered disabled and faded, and only the label click toggled a row. -->
    <input class="form-input"
    type="checkbox"
    [attr.disabled]="disabled ? true : null"
    [(ngModel)]="selected" />
</div> 

<div #cell
*ngFor="let column of columns; index as i"
class="cell"
[class.disabled]="disabled"
[ngClass]="column.customClass">
    <div *ngIf="isFirstRow"
    class="spacer"
    (onResize)="onResize(i, $event)"></div>

    <ng-container *ngTemplateOutlet="column.template ? column.template : simpleTemplate; context: { rowData: rowData, column: column }">
    </ng-container>
</div>

<ng-template #simpleTemplate let-rowData="rowData" let-column="column">
    <span>{{ getValue(column.field) }}</span>
</ng-template>

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  id-token: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm

    # Supplied from repository secrets rather than committed to nx.json.
    # Absent secret is fine: Nx falls back to the local cache.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT with bypass on the main ruleset, so the changelog-stamp commit can be pushed
          # back to the protected branch (the default GITHUB_TOKEN cannot bypass the rules).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install release tooling
        run: |
          npm install --no-save \
            semantic-release \
            semantic-release-monorepo \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/npm \
            @semantic-release/exec

      - name: Build
        run: npx nx run ui:build --configuration=production

      # Between the build and the publish, because this is the one check whose subject is the
      # artifact rather than the source, and a package that fails it must not reach the registry.
      - name: Check packaged styles
        run: node tools/check-packaged-styles.mjs

      - name: Release
        working-directory: libs/ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release -e semantic-release-monorepo

      - name: Find the released tag
        id: released
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags
          tag="$(git tag --points-at "$GITHUB_SHA" --list 'ui-v*' | sort -u | head -n 1)"

          if [ -z "$tag" ]; then
            echo "No release was published for this commit."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "released=true"
            echo "tag=$tag"
            echo "version=${tag#ui-v}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp and commit the changelog
        if: steps.released.outputs.released == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.released.outputs.version }}
        run: |
          set -euo pipefail

          # Turn the curated `[Unreleased]` section into the version that was just published.
          node scripts/stamp-changelog.mjs ui "$VERSION" --source

          if git diff --quiet -- libs/ui/CHANGELOG.md; then
            echo "No changelog changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add libs/ui/CHANGELOG.md
          git commit -m "chore(release): stamp the package changelog [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create the GitHub release
        if: steps.released.outputs.released == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.released.outputs.tag }}
          VERSION: ${{ steps.released.outputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists for $RELEASE_TAG."
            exit 0
          fi

          {
            echo "Published \`@zambon-dev/ui@${VERSION}\`."
            echo
            echo "Changes:"
            echo

            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git log --pretty=format:'- %s (%h)' "${BEFORE_SHA}..${GITHUB_SHA}"
            else
              git log --pretty=format:'- %s (%h)' -20 "$GITHUB_SHA"
            fi
          } > release-notes.md

          gh release create "$RELEASE_TAG" \
            --title "@zambon-dev/ui ${VERSION}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

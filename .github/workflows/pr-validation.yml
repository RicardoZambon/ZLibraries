name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      # A stacked PR is opened against its parent branch, which the branches
      # filter above excludes. When the parent merges, GitHub retargets it to
      # main -- and that arrives as "edited", so without this the PR would sit
      # forever waiting on a required check that never ran.
      - edited

permissions:
  contents: read

jobs:
  validate:
    name: Build validation
    runs-on: ubuntu-latest

    # Supplied from repository secrets rather than committed to nx.json.
    # Absent secret is fine: Nx falls back to the local cache.
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install release tooling
        run: |
          npm install --no-save \
            semantic-release \
            semantic-release-monorepo \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Check formatting
        run: npx nx format:check --base=$NX_BASE --head=$NX_HEAD

      - name: Lint affected projects
        run: npx nx affected --target=lint --base=$NX_BASE --head=$NX_HEAD

      - name: Test affected projects
        run: npx nx affected --target=test --base=$NX_BASE --head=$NX_HEAD --configuration=ci

      - name: Build affected packages
        run: npx nx affected --target=build --base=$NX_BASE --head=$NX_HEAD --configuration=production

      # Storybook compiles component styles from source and so cannot see this; only the packaged
      # artifact can. It runs against whatever the step above produced.
      - name: Check packaged styles
        run: node tools/check-packaged-styles.mjs

      - name: Build affected Storybooks
        run: npx nx affected --target=build-storybook --base=$NX_BASE --head=$NX_HEAD --configuration=ci

      - name: Check translation parity
        run: node tools/check-i18n-parity.mjs

      - name: Check breaking changes are marked
        run: node tools/check-breaking-changelog.mjs $NX_BASE

      # Always built, not only when affected: a guide-only PR changes no project, yet it can break
      # a link or name an example that does not exist. The content step fails on both, and on any
      # public input, output or model without a description.
      - name: Build the docs site
        run: npx nx run docs:site

      - name: Check the assembled site
        shell: bash
        run: |
          set -euo pipefail
          npm run build-storybook
          rm -rf site
          cp -r dist/apps/docs/browser site
          cp -r dist/storybook/ui-examples site/storybook
          node tools/docs-content/check-site.mjs site

      - name: Semantic release dry run
        working-directory: libs/ui
        env:
          SEMANTIC_RELEASE_VALIDATION: 'true'
        run: npx --no-install semantic-release --dry-run --no-ci -e semantic-release-monorepo

  changelog-check:
    name: Changelog check
    runs-on: ubuntu-latest
    # Tooling/CI-only PRs can skip this by adding the "no-changelog" label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG updates
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_REF"
          base="origin/$BASE_REF"

          changed="$(git diff --name-only "$base"...HEAD)"

          if echo "$changed" | grep -qE "^libs/ui/(src/|package.json$|ng-package.json$)" && ! echo "$changed" | grep -q "^libs/ui/CHANGELOG.md$"; then
            echo "::error::The package changed but its CHANGELOG.md was not updated."
            echo "Add an entry under '## [Unreleased]' in libs/ui/CHANGELOG.md."
            echo "If this PR genuinely needs no changelog (tooling/CI only), add the 'no-changelog' label."
            exit 1
          fi

          echo "Changelog check passed."

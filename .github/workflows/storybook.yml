name: Storybook

# The three Storybooks are the component documentation. They were already built on
# every PR and thrown away; this publishes the ones built from main to Pages.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should wait for the one in flight rather than cancel it, so the
# published site always corresponds to a complete build.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybooks
    runs-on: ubuntu-latest

    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybooks
        run: npm run build-storybook

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site
          for project in library framework shared; do
            if [ ! -d "dist/storybook/$project" ]; then
              echo "::error::dist/storybook/$project was not produced."
              exit 1
            fi
            cp -r "dist/storybook/$project" "site/$project"
          done

          # Landing page: the three Storybooks are separate builds, so something has
          # to link them together.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>ZLibraries Storybooks</title>
              <style>
                :root { color-scheme: light dark; }
                body {
                  margin: 0; min-height: 100vh; display: grid; place-items: center;
                  font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
                  background: Canvas; color: CanvasText;
                }
                main { padding: 2rem; max-width: 36rem; }
                h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
                p { margin: 0 0 2rem; opacity: .7; }
                ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
                a {
                  display: block; padding: 1rem 1.25rem; border-radius: .5rem;
                  border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
                  text-decoration: none; color: inherit;
                }
                a:hover, a:focus-visible {
                  border-color: color-mix(in srgb, CanvasText 45%, transparent);
                }
                strong { display: block; }
                span { opacity: .7; font-size: .875rem; }
              </style>
            </head>
            <body>
              <main>
                <h1>ZLibraries</h1>
                <p>Component documentation for the three published packages.</p>
                <ul>
                  <li><a href="./library/"><strong>@zambon-dev/library</strong><span>UI components, directives and pipes</span></a></li>
                  <li><a href="./framework/"><strong>@zambon-dev/framework</strong><span>Tabbed navigation, view scaffolding, modals</span></a></li>
                  <li><a href="./shared/"><strong>@zambon-dev/shared</strong><span>Authentication, layouts, history features</span></a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

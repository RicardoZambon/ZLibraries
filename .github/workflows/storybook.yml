name: Storybook

# The three Storybooks are the component documentation. They were already built on
# every PR and thrown away; this publishes the ones built from main to Pages.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should wait for the one in flight rather than cancel it, so the
# published site always corresponds to a complete build.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybooks
    runs-on: ubuntu-latest

    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "dist/storybook/ui" ]; then
            echo "::error::dist/storybook/ui was not produced."
            exit 1
          fi

          # One package, one Storybook: it is the site. The layers are its top-level
          # sections, so there is nothing left for a landing page to link together.
          cp -r dist/storybook/ui site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
